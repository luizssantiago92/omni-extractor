<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data — Omni Extractor</title>
    <link rel="stylesheet" href="table.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <img src="../icons/logo.png" width="28" height="28" alt="" />
        <div>
          <h1>Data</h1>
          <select id="dataset-select"></select>
        </div>
      </div>
      <div class="bar-right">
        <span id="row-meta" class="meta"></span>
        <button type="button" class="btn" id="btn-export">Export CSV</button>
      </div>
    </header>
    <main>
      <div class="table-wrap">
        <table id="grid">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="empty" class="empty is-hidden">No dataset yet. Extract a list from the side panel.</p>
    </main>
    <script src="table.js"></script>
  </body>
</html>
