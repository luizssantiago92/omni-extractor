<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Omni Extractor">
  <rect width="128" height="128" rx="24" fill="#0c1610"/>
  <!-- 6 extraction arms -->
  <g stroke="#1f7a4d" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="42" x2="64" y2="14"/>
    <line x1="83" y1="53" x2="108" y2="30"/>
    <line x1="83" y1="75" x2="108" y2="98"/>
    <line x1="64" y1="86" x2="64" y2="114"/>
    <line x1="45" y1="75" x2="20" y2="98"/>
    <line x1="45" y1="53" x2="20" y2="30"/>
  </g>
  <g fill="#228c5a">
    <ellipse cx="64" cy="12" rx="9" ry="6" transform="rotate(0 64 12)"/>
    <ellipse cx="110" cy="28" rx="9" ry="6" transform="rotate(60 110 28)"/>
    <ellipse cx="110" cy="100" rx="9" ry="6" transform="rotate(120 110 100)"/>
    <ellipse cx="64" cy="116" rx="9" ry="6" transform="rotate(180 64 116)"/>
    <ellipse cx="18" cy="100" rx="9" ry="6" transform="rotate(240 18 100)"/>
    <ellipse cx="18" cy="28" rx="9" ry="6" transform="rotate(300 18 28)"/>
  </g>
  <g fill="#d4af37">
    <circle cx="64" cy="12" r="3.2"/>
    <circle cx="110" cy="28" r="3.2"/>
    <circle cx="110" cy="100" r="3.2"/>
    <circle cx="64" cy="116" r="3.2"/>
    <circle cx="18" cy="100" r="3.2"/>
    <circle cx="18" cy="28" r="3.2"/>
  </g>
  <!-- Gold O -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#d4af37" stroke-width="11"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#f0d26e" stroke-width="2" opacity="0.55"/>
</svg>
